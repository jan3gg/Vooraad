<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Voorraadlijst</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --border: #e8e6e0;
    --ink: #1a1a18;
    --ink2: #6b6b65;
    --ink3: #a0a09a;
    --accent: #1a1a18;
    --tag-bg: #f0ede8;
    --vol-bg: #f5f3ef;
    --green: #2a7d4f;
    --green-bg: #edf7f1;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 2rem;
  }

  /* HEADER */
  .header {
    background: var(--ink);
    color: white;
    padding: 1.25rem 1rem 1rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }
  .header h1 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .header-meta {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.5);
    margin-top: 1px;
  }
  .total-badge {
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* SEARCH */
  .search-wrap {
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.45;
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 0.65rem 0.75rem 0.65rem 2.2rem;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.12);
    color: white;
    font-size: 0.9rem;
    outline: none;
  }
  #search::placeholder { color: rgba(255,255,255,0.45); }

  /* FILTER TABS */
  .filter-wrap {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0.5rem 1rem;
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filter-wrap::-webkit-scrollbar { display: none; }
  .filter-btn {
    background: var(--tag-bg);
    border: none;
    padding: 0.35rem 0.85rem;
    border-radius: 20px;
    font-size: 0.78rem;
    color: var(--ink2);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .filter-btn.active {
    background: var(--ink);
    color: white;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 0;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    flex: 1;
    padding: 0.6rem 0;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat-num { font-size: 1.1rem; font-weight: 600; }
  .stat-label { font-size: 0.62rem; color: var(--ink3); margin-top: 1px; }

  /* LIST */
  .list {
    padding: 0.5rem 0.75rem;
  }

  .group-header {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    padding: 0.9rem 0.25rem 0.35rem;
  }

  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 0.5rem;
    overflow: hidden;
  }

  .item-main {
    display: flex;
    align-items: center;
    padding: 0.75rem 0.9rem;
    gap: 0.75rem;
  }

  .item-total {
    font-size: 1.35rem;
    font-weight: 700;
    min-width: 36px;
    text-align: center;
    color: var(--ink);
    line-height: 1;
  }

  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-size: 0.88rem;
    font-weight: 500;
    line-height: 1.3;
    color: var(--ink);
    margin-bottom: 0.25rem;
  }
  .item-cat {
    font-size: 0.65rem;
    color: var(--ink3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .item-vols {
    border-top: 1px solid var(--border);
    padding: 0.5rem 0.9rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    background: var(--vol-bg);
  }

  .vol-pill {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.3rem 0.6rem;
    font-size: 0.78rem;
  }
  .vol-pill .vol-qty {
    font-weight: 700;
    color: var(--ink);
  }
  .vol-pill .vol-size {
    color: var(--ink2);
    font-size: 0.72rem;
  }

  /* Multi-volume indicator */
  .multi-badge {
    background: var(--green-bg);
    color: var(--green);
    font-size: 0.6rem;
    padding: 1px 6px;
    border-radius: 20px;
    font-weight: 600;
    white-space: nowrap;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--ink3);
    font-size: 0.9rem;
  }

  /* Sort bar */
  .sort-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.75rem;
    color: var(--ink3);
  }
  .sort-bar select {
    font-size: 0.75rem;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--ink);
    padding: 3px 6px;
    border-radius: 6px;
    font-family: inherit;
    outline: none;
  }

  #result-count {
    font-size: 0.72rem;
    color: var(--ink3);
    margin-left: auto;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>Voorraadlijst</h1>
      <div class="header-meta">Dubbele producten samengevoegd per volume</div>
    </div>
    <div class="total-badge" id="headerTotal"></div>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="search" id="search" placeholder="Zoek product..." autocomplete="off" autocorrect="off">
  </div>
</div>

<div class="filter-wrap" id="filterWrap"></div>

<div class="stats-bar" id="statsBar"></div>

<div class="sort-bar">
  <span>Sorteren:</span>

    <option value="za">Z → A</option>
  </select>
  <span id="result-count"></span>
</div>

<div class="list" id="list"></div>

const CATS = ['Alles', ...['Gin','Whisky','Wodka','Rum','Likeur','Jenever','Non-Alcoholic','Cognac','Tequila','Vermout','Champagne','Barware','Overig']];

let activeFilter = 'Alles';
let searchTerm = '';
let sortMode = 'qty-desc';

// Stats
const totalItems = DATA.length;
const totalQty = DATA.reduce((s, d) => s + d.total, 0);

document.getElementById('headerTotal').textContent = totalQty + ' stuks';

// Category counts
const catCounts = {};
DATA.forEach(d => {
  const c = CATS.slice(1).includes(d.cat) ? d.cat : 'Overig';
  catCounts[c] = (catCounts[c] || 0) + 1;
});

// Build filter tabs
const fw = document.getElementById('filterWrap');
CATS.forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (cat === 'Alles' ? ' active' : '');
  const count = cat === 'Alles' ? totalItems : (catCounts[cat] || 0);
  btn.textContent = cat + (count ? ' ' + count : '');
  btn.onclick = () => {
    activeFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  };
  fw.appendChild(btn);
});

// Sort
document.getElementById('sortSelect').onchange = e => { sortMode = e.target.value; render(); };

// Search
document.getElementById('search').oninput = e => { searchTerm = e.target.value.toLowerCase(); render(); };

function getFiltered() {
  let items = DATA.filter(d => {
    const inCat = activeFilter === 'Alles' || d.cat === activeFilter || (activeFilter === 'Overig' && !CATS.slice(1, -1).includes(d.cat));
    const inSearch = !searchTerm || d.name.toLowerCase().includes(searchTerm) || d.cat.toLowerCase().includes(searchTerm);
    return inCat && inSearch;
  });
  if (sortMode === 'qty-desc') items.sort((a,b) => b.total - a.total);
  else if (sortMode === 'qty-asc') items.sort((a,b) => a.total - b.total);
  else if (sortMode === 'az') items.sort((a,b) => a.name.localeCompare(b.name));
  else if (sortMode === 'za') items.sort((a,b) => b.name.localeCompare(a.name));
  return items;
}

function render() {
  const items = getFiltered();
  const list = document.getElementById('list');
  const filteredQty = items.reduce((s,d) => s+d.total, 0);

  // Stats
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-num">${items.length}</div><div class="stat-label">Producten</div></div>
    <div class="stat"><div class="stat-num">${filteredQty}</div><div class="stat-label">Stuks totaal</div></div>
    <div class="stat"><div class="stat-num">${items.filter(d=>d.volumes.length>1).length}</div><div class="stat-label">Multi-volume</div></div>
  `;

  document.getElementById('result-count').textContent = items.length + ' van ' + totalItems + ' producten';

  if (items.length === 0) {
    list.innerHTML = '<div class="empty">Geen producten gevonden</div>';
    return;
  }

  let html = '';
  items.forEach(d => {
    const multiVol = d.volumes.length > 1;
    const volPills = d.volumes.map(v =>
      `<div class="vol-pill"><span class="vol-qty">${v.qty}×</span><span class="vol-size">${v.vol}</span></div>`
    ).join('');

    html += `
      <div class="item">
        <div class="item-main">
          <div class="item-total">${d.total}</div>
          <div class="item-info">
            <div class="item-name">${d.name}${multiVol ? ' <span class="multi-badge">'+d.volumes.length+' maten</span>' : ''}</div>
            <div class="item-cat">${d.cat}</div>
          </div>
        </div>
        <div class="item-vols">${volPills}</div>
      </div>`;
  });

  list.innerHTML = html;
}

render();
